name: "🚀 Запрос загрузчика / версии | Request Loader / Version"
description: "Предложить новый загрузчик или версию | Suggest a new mod loader or game version"
title: "[Запрос / Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Добро пожаловать! / Welcome!
        Спасибо, что помогаете развивать **Ultimate Optimizations**! Пожалуйста, заполните форму ниже.
        Thank you for helping improve **Ultimate Optimizations**! Please fill out the form below.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "🔄 Проверка дубликатов / Duplicate Check"
      options:
        - label: "Я проверил(а) список существующих запросов, похожих предложений еще нет. / I have checked the existing issues and requests, and this is not a duplicate."
          required: true

  - type: dropdown
    id: loader-choice
    attributes:
      label: "📦 Желаемый загрузчик модов / Desired Mod Loader"
      description: "Выберите платформу, которую хотите видеть / Select the platform you want to see."
      options:
        - "Quilt"
        - "NeoForge"
        - "Fabric"
        - "Другой / Other"
    validations:
      required: true

  - type: textarea
    id: specific-loader-details
    attributes:
      label: "🧩 Специфический загрузчик и форки модов / Specific Loader and Mod Forks"
      description: "Если вы выбрали «Другой» или это редкий загрузчик (на котором, например, не работает Sodium и нужен определенный форк), напишите его название. Если вы знаете нужные аналоги модов — укажите их, это сильно ускорит портирование в случае одобрения. / If you selected 'Other' or it is a rare loader (e.g., Sodium doesn't work and a specific fork is needed), please specify. If you know the required mod alternatives, list them here to speed up the porting process if approved."
      placeholder: "Например: Название загрузчика, ссылка на форк Sodium или аналоги... / e.g., Loader name, link to Sodium fork or alternatives..."
    validations:
      required: false

  - type: input
    id: game-version
    attributes:
      label: "🎮 Версия игры / Game Version"
      description: "Какую версию Minecraft вы хотите? / Which version of Minecraft are you requesting?"
      placeholder: "Например: 26.2, 26.3, 1.21... / e.g. 26.2, 26.3, 1.21..."
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: "❓ Почему это необходимо? / Why is this change necessary?"
      description: "Опишите, почему сборке нужен этот загрузчик или переход / Explain why the pack needs this loader or update."
      placeholder: "Напишите вашу причину здесь... / Write your reason here..."
    validations:
      required: true

  - type: textarea
    id: expectations
    attributes:
      label: "✨ Чего вы ожидаете от этого изменения? / What do you expect from this change?"
      description: "Какие плюсы это даст? (например, выше FPS) / What are the benefits? (e.g. better performance)"
      placeholder: "Ваши ожидания... / Your expectations..."
    validations:
      required: true

  - type: checkboxes
    id: patience-agree
    attributes:
      label: "⏳ Подтверждение и готовность к ожиданию / Confirmation and Readiness to Wait"
      options:
        - label: "Я понимаю, что портирование сборки на новый загрузчик или версию — это сложный процесс, требующий много времени. Я готов(а) ждать, если разработчик одобрит это предложение. / I understand that porting the modpack is a complex and time-consuming process. I am willing to wait if the developer accepts this request."
          required: true
