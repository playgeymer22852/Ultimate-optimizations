name: "🖥️ Ошибки на устройствах и платформах / Platform & Hardware Bugs"
description: "Если сборка лагает или вылетает на смартфонах, Steam Deck, Linux, Mac или на определенном железе / If the pack lags or crashes on phones, Steam Deck, Linux, Mac, or specific hardware"
title: "[Device/Platform Bug / Ошибка Устройства/Платформы]: "
labels: ["hardware", "bug"]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "🔄 Проверка дубликатов / Duplicate Check"
      options:
        - label: "Я проверил(а) список существующих тем, похожей проблемы еще нет. / I have checked the existing issues, and this is not a duplicate."
          required: true

  - type: dropdown
    id: os-platform
    attributes:
      label: "📱 Операционная система и платформа / Operating System & Platform"
      description: "Выберите вашу ОС или устройство / Select your OS or device"
      options:
        - "Android / Смартфон"
        - "iOS / iPhone / iPad"
        - "Steam Deck / SteamOS"
        - "Linux (Ubuntu, Arch, Fedora etc.)"
        - "MacOS (Intel / Apple Silicon M1/M2/M3)"
        - "Windows (Старый ПК / Специфическое железо)"
        - "Другое / Other (укажите в поле ниже / specify below)"
    validations:
      required: true

  - type: input
    id: custom-device-launcher
    attributes:
      label: "🕹️ Точная модель устройства и Лаунчер / Exact Device Model & Launcher"
      description: "Напишите модель (например: Poco X3, Steam Deck OLED, MacBook Pro) и через какой лаунчер запускаете (PojavLauncher, Prism, Modrinth App). / State the model (e.g., Poco X3, Steam Deck OLED) and the launcher used."
      placeholder: "Например: Poco X3 Pro, PojavLauncher / e.g., Steam Deck, Prism Launcher"
    validations:
      required: true

  - type: input
    id: hardware-specs
    attributes:
      label: "📼 Видеокарта, встройка и процессор / GPU, Integrated Graphics & CPU"
      description: "Укажите вашу видеокарту/встройку (Mali-G76, Intel HD 620, RTX 3060) и процессор. / Specify your GPU/Integrated graphics and CPU."
      placeholder: "Например: Snapdragon 860, Adreno 640 / e.g., Intel Core i3, Intel HD 520"
    validations:
      required: true

  - type: textarea
    id: hardware-bug-description
    attributes:
      label: "📝 Полное описание проблемы / Full Description of the Issue"
      description: "Опишите, что именно идет не так конкретно на вашем устройстве (артефакты графики, вылет при загрузке, зависание). / Describe what exactly goes wrong on your device (graphic artifacts, crash on load, freezing)."
      placeholder: "Опишите баг... / Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: device-logs
    attributes:
      label: "📋 Логи и краш-репорты устройства / Device Logs and Crash Reports"
      description: "Прикрепите содержимое файлов `latest.log` или краш-репорт лаунчера. Вы можете просто перетащить файл сюда. / Attach the contents of `latest.log` or launcher crash report. You can drag and drop files here."
      placeholder: "Вставьте логи сюда... / Paste logs here..."
    validations:
      required: true

  - type: checkboxes
    id: patience-agree
    attributes:
      label: "⏳ Подтверждение / Confirmation"
      options:
        - label: "Я понимаю, что баги на мобильных лаунчерах и редких ОС зависят от самих лаунчеров и драйверов, но предоставляю инфо для анализа. / I understand that bugs on mobile launchers and rare OS depend on launchers/drivers themselves, but I provide info for analysis."
          required: true
